<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hobby Attic Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#17243b;font:15px system-ui}header{background:#17243b;color:white;padding:24px clamp(16px,4vw,60px);display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:24px}header a{color:#b8d5ff}main{max-width:1400px;margin:auto;padding:24px}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white}input:not([type=checkbox]),textarea,select{width:100%;margin:6px 0 14px}label{display:block;font-weight:600}button{cursor:pointer;background:#2456be;color:white;border:0;font-weight:600;margin:5px 0}button:disabled{opacity:.5}button.secondary{background:#e4ebf5;color:#17243b}#remove{background:#a52936}#login{max-width:430px;margin:60px auto;background:white;padding:28px;border-radius:16px}#status:not(:empty){background:#e0ecff;padding:14px;border-radius:10px}#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:white;padding:18px;border-radius:12px}.stat strong{display:block;font-size:30px}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(350px,1.3fr);gap:22px;align-items:start}.box{background:white;border-radius:14px;padding:20px;box-shadow:0 3px 16px #192d4410}#cards{max-height:850px;overflow:auto}.item{display:flex;align-items:center;text-align:left;width:100%;gap:12px;background:#f5f7fb;color:#17243b;border:1px solid #e0e6ef}.item.active{border-color:#2456be;background:#e1ebff}.item img{width:64px;height:64px;object-fit:cover;border-radius:8px}.item small{display:block;color:#52647d}.preview{width:130px;height:130px;object-fit:contain;background:#f5f7fb;border-radius:10px}fieldset{border:1px solid #dce3ed;border-radius:10px;margin:12px 0}legend{font-weight:bold}#sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#sizes .preview{width:100%;height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap}textarea{min-height:95px}details{margin:16px 0;padding:12px;background:#f0f4fa;border-radius:10px}summary{cursor:pointer;font-weight:bold}@media(max-width:800px){.layout{grid-template-columns:1fr}#cards{max-height:330px}#sizes{grid-template-columns:1fr}main{padding:12px}.stat{padding:12px}.stat strong{font-size:22px}}</style><header><h1>Hobby Attic <small> / Studio</small></h1><a href="../">View shop ↗</a></header><main><p id="status" role="status"></p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><section hidden id="panel"><div class="actions"><button id="fresh">＋ New product</button><button class="secondary" id="out">Sign out</button></div><div id="stats"></div><div class="layout"><aside class="box"><h2>Product catalogue</h2><input id="search" placeholder="Search name or category…"><select id="filter"><option value="">All products</option><option value="live">Published</option><option value="draft">Drafts</option></select><div id="cards"></div><select id="list" hidden></select></aside><section class="box"><h2 id="editorTitle">New product</h2><form id="edit"><label>Name<input id="name" required></label><label>Category<input id="category" list="categories" required><datalist id="categories"></datalist></label><label>Description<textarea id="description"></textarea></label><label>Reference price<input id="reference" type="number" min="0"></label><label>Main image<input type="file" id="image" accept="image/jpeg,image/png,image/webp"></label><img class="preview" id="mainPreview" alt="Main image preview"><p>Images are resized and compressed automatically when possible.</p><div id="sizes"></div><details><summary>Printing cost calculator</summary><label>Target size<select id="target"><option>3</option><option>4</option><option>5</option></select></label><label>Filament ₹/kg<input id="kg" type="number" min="0" value="1000"></label><label>Material grams<input id="grams" type="number" min="0" value="80"></label><label>Print hours<input id="hours" type="number" min="0" step="0.1" value="4"></label><label>Machine ₹/hour<input id="rate" type="number" min="0" value="10"></label><label>Packaging ₹<input id="pack" type="number" min="0" value="30"></label><label>Markup %<input id="markup" type="number" min="0" value="100"></label><p id="estimate"></p><button type="button" id="applyCost">Apply suggested price</button></details><label><input id="draft" type="checkbox">Draft</label><button>Save product</button></form><div class="actions"><button class="secondary" id="duplicate">Duplicate as draft</button><button id="remove">Delete product</button></div></section></div></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://ijkbenyfcfizzafzwcjl.supabase.co','sb_publishable_wfJpr7rf3xm4Vazwe4GumA_392dVyua'),$=x=>document.getElementById(x),sizes=['3','4','5'];let rows=[],current=null;const msg=x=>$('status').textContent=x;
$('sizes').innerHTML=sizes.map(s=>'<fieldset><legend>'+s+' inches</legend><label>Price (₹)<input type="number" min="0" id="p'+s+'"></label><label>Photo<input type="file" accept="image/jpeg,image/png,image/webp" id="i'+s+'"></label><img class="preview" id="v'+s+'" alt="Size preview"></fieldset>').join('');
function edit(r){$('editorTitle').textContent=r?'Edit: '+r.data.name:'New product';current=r;let d=r?.data||{};$('mainPreview').src=photo(d.image);for(let k of ['name','category','description'])$(k).value=d[k]||'';$('reference').value=d.referencePrice??'';$('draft').checked=r?.draft??true;$('image').value='';for(let s of sizes){$('p'+s).value=d.prices?.[s]??'';$('i'+s).value='';$('v'+s).src=photo(d.sizeImages?.[s]||d.image)}renderCards()}
async function load(){let {data,error}=await db.from('products').select('*').order('id');if(error)throw error;rows=data;$('list').replaceChildren(new Option('Select product',''),...rows.map(r=>new Option(r.data.name+(r.draft?' (draft)':''),r.id)));edit(null);$('categories').replaceChildren(...[...new Set(rows.map(r=>r.data.category))].map(x=>new Option(x,x)));renderCards()}
async function start(){let {data:{user}}=await db.auth.getUser();if(!user)return;let {data}=await db.from('catalog_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!data)return msg('Account not authorised yet');$('login').hidden=true;$('panel').hidden=false;await load()}
$('login').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);await start()};$('out').onclick=async()=>{await db.auth.signOut();location.reload()};$('list').onchange=()=>edit(rows.find(r=>r.id===$('list').value));$('fresh').onclick=()=>{$('list').value='';edit(null)};
async function upload(f){if(!f)return null;if(['image/jpeg','image/png','image/webp'].includes(f.type)){try{let bitmap=await createImageBitmap(f),scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.85));if(blob&&blob.size<f.size)f=blob}catch{}}let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];if(!ext||f.size>5242880)throw Error('Invalid image or over 5 MB');let path=crypto.randomUUID()+'.'+ext;let {error}=await db.storage.from('product-images').upload(path,f);if(error)throw error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
$('edit').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{let id=current?.id||'item-'+crypto.randomUUID(),d={...current?.data,id,name:$('name').value,category:$('category').value,description:$('description').value,referencePrice:$('reference').value===''?null:+$('reference').value,draft:$('draft').checked,prices:{},sizeImages:{}};d.image=await upload($('image').files[0])||current?.data.image||'images/placeholder.svg';for(let s of sizes){d.prices[s]=$('p'+s).value===''?null:+$('p'+s).value;d.sizeImages[s]=await upload($('i'+s).files[0])||current?.data.sizeImages?.[s]||''}let {error}=await db.from('products').upsert({id,data:d,draft:d.draft});if(error)throw error;await load();$('list').value=id;edit(rows.find(r=>r.id===id));msg('Saved')}catch(e){msg(e.message)}finally{e.submitter.disabled=false}};$('remove').onclick=async()=>{if(!current||!confirm('Delete product?'))return;let {error}=await db.from('products').delete().eq('id',current.id);if(error)return msg(error.message);await load();msg('Deleted')};function photo(x){return /^https:\/\//.test(x||'')?x:'../'+(x||'images/placeholder.svg')}
function renderCards(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('stats').innerHTML=[['Total',rows.length],['Published',rows.filter(r=>!r.draft).length],['Drafts',rows.filter(r=>r.draft).length]].map(([k,v])=>'<div class="stat">'+k+'<strong>'+v+'</strong></div>').join('');$('cards').replaceChildren(...rows.filter(r=>(r.data.name+' '+r.data.category).toLowerCase().includes(q)&&(!f||(f==='draft'?r.draft:!r.draft))).map(r=>{let b=document.createElement('button');b.className='item'+(current?.id===r.id?' active':'');let im=document.createElement('img');im.src=photo(r.data.image);im.loading='lazy';let t=document.createElement('span');t.textContent=r.data.name;let sub=document.createElement('small');sub.textContent=r.data.category+' · '+(r.draft?'Draft':'Published');t.append(sub);b.append(im,t);b.onclick=()=>{$('list').value=r.id;edit(r)};return b}))}
$('search').oninput=renderCards;$('filter').onchange=renderCards;
for(let [input,preview] of [['image','mainPreview'],...sizes.map(s=>['i'+s,'v'+s])]){$(input).onchange=()=>{let f=$(input).files[0];if(f){let u=URL.createObjectURL(f);$(preview).onload=()=>URL.revokeObjectURL(u);$(preview).src=u}}}
function cost(){let v=k=>Math.max(0,Number($(k).value)||0),base=v('kg')*v('grams')/1000+v('hours')*v('rate')+v('pack'),price=Math.ceil(base*(1+v('markup')/100));$('estimate').textContent='Cost ₹'+base.toFixed(2)+' · Suggested price ₹'+price;return price}
for(let k of ['kg','grams','hours','rate','pack','markup'])$(k).oninput=cost;$('applyCost').onclick=()=>{$('p'+$('target').value).value=cost()};cost();
$('duplicate').onclick=async()=>{if(!current)return msg('Select a product first');try{let id='item-'+crypto.randomUUID(),d={...current.data,id,name:current.data.name+' (copy)',draft:true};let {error}=await db.from('products').insert({id,data:d,draft:true});if(error)throw error;await load();edit(rows.find(r=>r.id===id));msg('Draft copy created')}catch(e){msg(e.message)}};
start().catch(e=>msg(e.message));
</script></html>
