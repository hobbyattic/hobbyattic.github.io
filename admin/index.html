<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hobby Attic Admin</title><style>body{font:16px system-ui;max-width:800px;margin:35px auto;padding:20px}input,textarea,select,button{font:inherit;padding:9px;margin:6px 0}label{display:block}input:not([type=checkbox]),textarea,select{width:95%}button{cursor:pointer}</style><h1>Hobby Attic Admin</h1><p id="status"></p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><section hidden id="panel"><button id="out">Sign out</button><select id="list"></select><button id="fresh">New product</button><form id="edit"><label>Name<input id="name" required></label><label>Category<input id="category" required></label><label>Description<textarea id="description"></textarea></label><label>Reference price<input id="reference" type="number" min="0"></label><label>Main image<input type="file" id="image" accept="image/jpeg,image/png,image/webp"></label><div id="sizes"></div><label><input id="draft" type="checkbox">Draft</label><button>Save product</button></form><button id="remove">Delete product</button></section><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://ijkbenyfcfizzafzwcjl.supabase.co','sb_publishable_wfJpr7rf3xm4Vazwe4GumA_392dVyua'),$=x=>document.getElementById(x),sizes=['3','4','5'];let rows=[],current=null;const msg=x=>$('status').textContent=x;
$('sizes').innerHTML=sizes.map(s=>'<fieldset><legend>'+s+' inches</legend><label>Price (₹)<input type="number" min="0" id="p'+s+'"></label><label>Photo<input type="file" accept="image/jpeg,image/png,image/webp" id="i'+s+'"></label></fieldset>').join('');
function edit(r){current=r;let d=r?.data||{};for(let k of ['name','category','description'])$(k).value=d[k]||'';$('reference').value=d.referencePrice??'';$('draft').checked=r?.draft??true;$('image').value='';for(let s of sizes){$('p'+s).value=d.prices?.[s]??'';$('i'+s).value=''}}
async function load(){let {data,error}=await db.from('products').select('*').order('id');if(error)throw error;rows=data;$('list').replaceChildren(new Option('Select product',''),...rows.map(r=>new Option(r.data.name+(r.draft?' (draft)':''),r.id)));edit(null)}
async function start(){let {data:{user}}=await db.auth.getUser();if(!user)return;let {data}=await db.from('catalog_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!data)return msg('Account not authorised yet');$('login').hidden=true;$('panel').hidden=false;await load()}
$('login').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);await start()};$('out').onclick=async()=>{await db.auth.signOut();location.reload()};$('list').onchange=()=>edit(rows.find(r=>r.id===$('list').value));$('fresh').onclick=()=>{$('list').value='';edit(null)};
async function upload(f){if(!f)return null;let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];if(!ext||f.size>5242880)throw Error('Invalid image or over 5 MB');let path=crypto.randomUUID()+'.'+ext;let {error}=await db.storage.from('product-images').upload(path,f);if(error)throw error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
$('edit').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{let id=current?.id||'item-'+crypto.randomUUID(),d={...current?.data,id,name:$('name').value,category:$('category').value,description:$('description').value,referencePrice:$('reference').value===''?null:+$('reference').value,draft:$('draft').checked,prices:{},sizeImages:{}};d.image=await upload($('image').files[0])||current?.data.image||'images/placeholder.svg';for(let s of sizes){d.prices[s]=$('p'+s).value===''?null:+$('p'+s).value;d.sizeImages[s]=await upload($('i'+s).files[0])||current?.data.sizeImages?.[s]||''}let {error}=await db.from('products').upsert({id,data:d,draft:d.draft});if(error)throw error;await load();$('list').value=id;edit(rows.find(r=>r.id===id));msg('Saved')}catch(e){msg(e.message)}finally{e.submitter.disabled=false}};$('remove').onclick=async()=>{if(!current||!confirm('Delete product?'))return;let {error}=await db.from('products').delete().eq('id',current.id);if(error)return msg(error.message);await load();msg('Deleted')};start().catch(e=>msg(e.message));
</script></html>
